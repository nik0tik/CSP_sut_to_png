<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Извлечение картинок из кистей CSP</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 680px;
         margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; }
  #drop { border: 2px dashed #888; border-radius: 12px; padding: 40px 20px;
          text-align: center; margin: 24px 0; }
  #drop.over { border-color: #2a7; background: rgba(34,170,119,.08); }
  button { font: inherit; padding: 10px 18px; border-radius: 8px;
           border: 1px solid #888; background: transparent; cursor: pointer; }
  button:focus-visible { outline: 3px solid #2a7; outline-offset: 2px; }
  #log { font: 13px/1.45 ui-monospace, monospace; white-space: pre-wrap;
         max-height: 320px; overflow: auto; border-top: 1px solid #8884;
         padding-top: 12px; }
  .opts { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; }
  .muted { opacity: .7; font-size: 14px; }
</style>
</head>
<body>

<h1>Извлечение картинок из кистей Clip Studio Paint</h1>
<p class="muted">Файлы не загружаются на сервер — всё считается в вашем браузере.
Каждая кисть получает свою подпапку с PNG.</p>

<div id="drop">
  <p>Перетащите сюда папку с файлами <code>.sut</code></p>
  <button id="pick" type="button">Выбрать папку</button>
  <input id="input" type="file" webkitdirectory multiple hidden>
</div>

<div class="opts">
  <label><input id="deep" type="checkbox"> искать во всех таблицах</label>
  <label>пропускать меньше
    <input id="min" type="number" value="0" min="0" max="4096" style="width:5em">
    px</label>
</div>

<p><button id="save" type="button" hidden>Сохранить в папку…</button>
   <button id="zip" type="button" hidden>Скачать ZIP</button></p>

<div id="log" role="log" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"
        integrity="sha512-t3l1yTmCLmBTUOHhODe+dqCFCFyBTsxYzZDDMFbA/PSPXGnCJgcMYUuHBBS0lqB6vjNC1S5AmtJmnFYW/9BOZg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
const CDN = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/";
const PNG_SIG = [0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a];
const logBox = document.getElementById("log");
let result = null;   // [{path, bytes}]
let rootName = "brushes";

const log = (text) => { logBox.textContent += text + "\n";
                        logBox.scrollTop = logBox.scrollHeight; };

/* ---------- разбор PNG: идём по чанкам, а не ищем IEND по байтам ---------- */
const isAlpha = (c) => (c>=65&&c<=90)||(c>=97&&c<=122);

function readPng(data, start) {
  const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
  let pos = start + 8, width = 0, height = 0;
  while (pos + 8 <= data.length) {
    const length = view.getUint32(pos);
    const t = [data[pos+4], data[pos+5], data[pos+6], data[pos+7]];
    if (!t.every(isAlpha)) return null;
    const end = pos + 8 + length + 4;
    if (end > data.length) return null;
    const type = String.fromCharCode(...t);
    if (type === "IHDR") {
      if (length < 13) return null;
      width = view.getUint32(pos + 8);
      height = view.getUint32(pos + 12);
    } else if (type === "IEND") {
      if (!(width > 0 && width <= 60000 && height > 0 && height <= 60000)) return null;
      return { bytes: data.subarray(start, end), width, height };
    }
    pos = end;
  }
  return null;
}

function indexOfSig(data, from) {
  outer: for (let i = from; i + 8 <= data.length; i++) {
    for (let k = 0; k < 8; k++) if (data[i+k] !== PNG_SIG[k]) continue outer;
    return i;
  }
  return -1;
}

function findPngs(data) {
  const out = [];
  let pos = 0;
  for (;;) {
    const start = indexOfSig(data, pos);
    if (start === -1) return out;
    const png = readPng(data, start);
    if (png) { out.push(png); pos = start + png.bytes.length; }
    else pos = start + 8;
  }
}

/* ---------- чтение .sut ---------- */
function blobsFrom(db, deep) {
  const blobs = [];
  const push = (res) => res.forEach(r => r.values.forEach(row =>
    row.forEach(v => { if (v instanceof Uint8Array) blobs.push(v); })));
  if (!deep) {
    try { push(db.exec("SELECT FileData FROM MaterialFile")); return blobs; }
    catch (e) { /* нет такой таблицы — уходим в общий обход */ }
  }
  const names = db.exec("SELECT name FROM sqlite_master WHERE type='table'");
  if (!names.length) return blobs;
  for (const [table] of names[0].values) {
    try { push(db.exec(`SELECT * FROM "${String(table).replace(/"/g,'""')}"`)); }
    catch (e) { /* пропускаем нечитаемую таблицу */ }
  }
  return blobs;
}

async function sha1(bytes) {
  const hash = await crypto.subtle.digest("SHA-1", bytes);
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2,"0")).join("");
}

async function extract(SQL, bytes, deep, minSide) {
  let blobs = [];
  const isDb = String.fromCharCode(...bytes.subarray(0,15)) === "SQLite format 3";
  if (isDb) {
    let db = null;
    try { db = new SQL.Database(bytes); blobs = blobsFrom(db, deep); }
    catch (e) { blobs = []; }
    finally { if (db) db.close(); }
  }
  if (!blobs.length) blobs = [bytes];

  const images = [], seen = new Set();
  let skipped = 0;
  for (const blob of blobs) {
    for (const png of findPngs(blob)) {
      if (minSide && Math.min(png.width, png.height) < minSide) { skipped++; continue; }
      const key = await sha1(png.bytes);
      if (seen.has(key)) continue;
      seen.add(key);
      images.push(png);
    }
  }
  return { images, skipped };
}

/* ---------- имена ---------- */
const safeStem = (name) => (name.replace(/\.[^.]*$/, "")
  .replace(/[<>:"/\\|?*\x00-\x1f]/g, "_").replace(/^[\s.]+|[\s.]+$/g, "") || "brush");

function uniqueName(name, used) {
  let candidate = name, bump = 2;
  while (used.has(candidate.toLowerCase())) candidate = `${name} (${bump++})`;
  used.add(candidate.toLowerCase());
  return candidate;
}

/* ---------- ZIP без сжатия: PNG уже сжаты ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function buildZip(entries) {
  const enc = new TextEncoder();
  const parts = [], dir = [];
  let offset = 0;
  for (const entry of entries) {
    const name = enc.encode(entry.path);
    const size = entry.bytes.length;
    const crc = crc32(entry.bytes);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);   // имена в UTF-8: важно для кириллицы
    local.setUint16(12, 0x21, true);    // дата 1980-01-01
    local.setUint32(14, crc, true);
    local.setUint32(18, size, true);
    local.setUint32(22, size, true);
    local.setUint16(26, name.length, true);
    parts.push(new Uint8Array(local.buffer), name, entry.bytes);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(14, 0x21, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, size, true);
    cd.setUint32(24, size, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    dir.push(new Uint8Array(cd.buffer), name);

    offset += 30 + name.length + size;
  }
  const dirSize = dir.reduce((sum, p) => sum + p.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, entries.length, true);
  eocd.setUint16(10, entries.length, true);
  eocd.setUint32(12, dirSize, true);
  eocd.setUint32(16, offset, true);
  return new Blob([...parts, ...dir, new Uint8Array(eocd.buffer)],
                  { type: "application/zip" });
}

/* ---------- сбор файлов из drop и из input ---------- */
async function walk(entry, out) {
  if (entry.isFile) {
    if (!/\.sut$/i.test(entry.name)) return;
    out.push(await new Promise((res, rej) => entry.file(res, rej)));
    return;
  }
  const reader = entry.createReader();
  for (;;) {
    const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    if (!batch.length) break;                       // отдаётся порциями по 100
    for (const child of batch) await walk(child, out);
  }
}

/* ---------- основной проход ---------- */
async function run(files) {
  logBox.textContent = "";
  result = null;
  document.getElementById("save").hidden = true;
  document.getElementById("zip").hidden = true;

  const suts = files.filter(f => /\.sut$/i.test(f.name));
  if (!suts.length) { log("Файлы .sut не найдены."); return; }

  const deep = document.getElementById("deep").checked;
  const minSide = Number(document.getElementById("min").value) || 0;
  log(`Найдено кистей: ${suts.length}`);
  log(`Режим: ${deep ? "все таблицы" : "только наконечники (MaterialFile)"}\n`);

  const SQL = await initSqlJs({ locateFile: (f) => CDN + f });
  const out = [], usedDirs = new Set();
  let total = 0, empty = 0, skippedAll = 0;

  for (let i = 0; i < suts.length; i++) {
    const file = suts[i];
    const label = `[${i+1}/${suts.length}] ${file.name}`;
    let images, skipped;
    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      ({ images, skipped } = await extract(SQL, bytes, deep, minSide));
    } catch (e) { log(`${label} — ошибка: ${e.message}`); continue; }

    skippedAll += skipped;
    if (!images.length) {
      empty++;
      log(`${label} — картинок нет${skipped ? ` (отсеяно: ${skipped})` : ""}`);
      continue;
    }
    const stem = safeStem(file.name);
    const folder = uniqueName(stem, usedDirs);
    images.forEach((png, index) => {
      const name = images.length === 1 ? `${stem}.png` : `${stem}_${index+1}.png`;
      out.push({ path: `${rootName}_extracted/${folder}/${name}`, bytes: png.bytes });
    });
    total += images.length;
    log(`${label} — ${images.length} шт. [${images.map(p => p.width+"x"+p.height).join(", ")}]`);
  }

  log(`\n${"-".repeat(46)}`);
  log(`Картинок извлечено: ${total}`);
  if (empty) log(`Без картинок: ${empty}`);
  if (skippedAll) log(`Отсеяно по размеру: ${skippedAll}`);
  if (!total) return;

  result = out;
  document.getElementById("zip").hidden = false;
  if (window.showDirectoryPicker) document.getElementById("save").hidden = false;
  else log("\nЗапись прямо на диск доступна в Chrome и Edge. Здесь — кнопка ZIP.");
}

/* ---------- сохранение ---------- */
document.getElementById("save").onclick = async () => {
  try {
    const root = await window.showDirectoryPicker({ mode: "readwrite" });
    for (const entry of result) {
      let dir = root;
      const parts = entry.path.split("/");
      for (const part of parts.slice(0, -1)) {
        dir = await dir.getDirectoryHandle(part, { create: true });
      }
      const handle = await dir.getFileHandle(parts.at(-1), { create: true });
      const stream = await handle.createWritable();
      await stream.write(entry.bytes);
      await stream.close();
    }
    log(`\nЗаписано файлов: ${result.length}`);
  } catch (e) {
    if (e.name !== "AbortError") log(`\nНе удалось сохранить: ${e.message}`);
  }
};

document.getElementById("zip").onclick = () => {
  const url = URL.createObjectURL(buildZip(result));
  const link = document.createElement("a");
  link.href = url;
  link.download = `${rootName}_extracted.zip`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
};

/* ---------- ввод ---------- */
const drop = document.getElementById("drop");
const input = document.getElementById("input");
document.getElementById("pick").onclick = () => input.click();

input.onchange = () => {
  const files = [...input.files];
  const rel = files.find(f => f.webkitRelativePath)?.webkitRelativePath;
  if (rel) rootName = safeStem(rel.split("/")[0] + ".x");
  run(files);
};

["dragenter","dragover"].forEach(type => drop.addEventListener(type, (e) => {
  e.preventDefault(); drop.classList.add("over");
}));
["dragleave","drop"].forEach(type => drop.addEventListener(type, () =>
  drop.classList.remove("over")));

drop.addEventListener("drop", async (e) => {
  e.preventDefault();
  const entries = [...e.dataTransfer.items]
    .map(item => item.webkitGetAsEntry?.()).filter(Boolean);
  if (!entries.length) { log("Браузер не отдал содержимое папки."); return; }
  const folder = entries.find(en => en.isDirectory);
  if (folder) rootName = safeStem(folder.name + ".x");
  const files = [];
  for (const entry of entries) await walk(entry, files);
  run(files);
});
</script>
</body>
</html>
